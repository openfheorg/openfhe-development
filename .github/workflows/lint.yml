name: Lint

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    # A GitHub-hosted runner keeps this off the build machines. The job needs
    # only Python and network access, and it takes about a minute. The image is
    # pinned rather than tracking ubuntu-latest, so what that label points at
    # cannot change this job underneath us.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # pre-commit downloads the pinned clang-format and cpplint on first use.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit

      # --all-files rather than only the files the pull request touches, so that
      # formatting drift anywhere in the tree is reported rather than accumulating.
      # --show-diff-on-failure prints the corrections the hooks would apply.
      - name: Run the hooks over the whole tree
        run: pre-commit run --all-files --show-diff-on-failure --color=always
