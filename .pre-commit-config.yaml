# Tool versions are pinned here and downloaded by pre-commit itself, so nothing
# has to be installed system-wide except pre-commit (pip3 install pre-commit).
#   pre-commit install                        run the hooks on every commit
#   pre-commit run --all-files                check/fix the whole tree
#   pre-commit run --files [file1] [file2]    check/fix specific files
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
        - id: trailing-whitespace
        - id: end-of-file-fixer
        - id: check-merge-conflict
        - id: mixed-line-ending
        - id: fix-byte-order-marker
    - repo: https://github.com/pre-commit/mirrors-clang-format
      rev: v23.1.1
      hooks:
        - id: clang-format
          types_or: [c, c++]
    - repo: https://github.com/cpplint/cpplint
      rev: 2.0.2
      hooks:
        - id: cpplint
    - repo: local
      hooks:
        - id: check-diagnostic-output
          name: no direct stdout/stderr in library code
          description: >
            Library diagnostics must go through utils/diagnostic_output.h, so an
            embedder can redirect them and -DWITH_DEFAULT_DIAGNOSTIC_SINK=OFF
            leaves the library free of std::cerr/std::cout.
          entry: scripts/maint/check-diagnostic-output.py
          language: script
          files: ^src/[^/]+/(lib|include)/.*\.(c|cpp|h|hpp)$
